[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "braingraph-runtime"
version = "0.1.0"
description = "CLI and local runtime for BrainGraph workspaces"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "watchdog>=5,<7",
    "neo4j>=5.25,<6",
]

[project.scripts]
bg = "bg_cli.main:app"

[tool.setuptools.packages.find]
include = ["bg_cli*"]